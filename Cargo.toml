[workspace]
members = ["animation", "functions", "proc-macros", "ui"]

[package]
name = "bun-nuvon-bevy-utils"
version = "0.4.0"
edition = "2024"
description = "Utility library for Bun-Nuvon games made with Bevy"
homepage = "https://github.com/Bun-Nuvon/bun-nuvon-bevy-utils"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bun-Nuvon/bun-nuvon-bevy-utils"

[dependencies]
animation = { path = "animation", optional = true }
functions = { path = "functions" }
proc-macros = { path = "proc-macros" }
ui = { path = "ui", optional = true }

[features]
default = ["animation", "ui"]
animation = ["dep:animation"]
ui = ["dep:ui"]
