[workspace]
members = ["proc-macros", "ui"]

[package]
name = "bun-nuvon-bevy-utils"
version = "0.3.1"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", default-features = false }
proc-macros = { path = "proc-macros" }
ui = { path = "ui", optional = true }

[features]
default = ["ui"]
ui = ["dep:ui"]
